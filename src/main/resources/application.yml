spring:
  application:
    name: support-ticket-api

  profiles:
    default: local

  web:
    resources:
      add-mappings: false


  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  cache:
    type: redis
    cache-names:
      - activeCategories
      - ticketById
      - dashboardSummary

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.yourname.supportticket: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

app:
  api:
    version: v1

  jwt:
    issuer: support-ticket-api
    secret: ${JWT_SECRET}
    access-token-expiration: PT15M

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Request-Id
    exposed-headers: Location,X-Request-Id
    allow-credentials: true
    max-age: 3600

  pagination:
    default-page-size: 20
    max-page-size: 100

  attachment:
    max-file-size-bytes: 10485760
    allowed-content-types:
      - application/pdf
      - image/png
      - image/jpeg
      - text/plain
    local-storage-path: ${ATTACHMENT_STORAGE_PATH:./data/attachments}

  sla:
    warning-threshold-percent: 80
    monitoring-cron: "0 */15 * * * *"

  notification:
    email-enabled: ${EMAIL_ENABLED:false}
